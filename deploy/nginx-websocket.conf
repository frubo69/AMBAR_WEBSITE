# AMBAR — проксирование вебсокета звонков.
#
# Этот блок обязан быть в КАЖДОМ server-блоке, откуда открываются приложения:
# основной домен (приложение водителя и панель оператора) и owner-поддомен
# (AMBAR STAR). Без него nginx отвечает на попытку соединения обычным HTTP,
# сокет молча не открывается, и приложение показывает «связи пока нет» — при
# полностью исправном сервере. Проверки, которые ходят напрямую в 127.0.0.1:8080,
# эту поломку не видят: они идут мимо nginx.
#
# Ставится ПЕРЕД общим «location /», иначе он заберёт путь себе.
#
# ВАЖНО, на чём я обжёгся: приложения раздаются не с того домена, который
# стоит в коде по умолчанию, а с адреса из DRIVER_WEBAPP_URL и его соседей в
# .env. Добавлять блок надо именно тому server-блоку, который обслуживает ЭТОТ
# адрес — иначе на сервере всё зелено, а на телефоне «связи нет».
# Проверять: bash deploy/call-check.sh — он берёт адреса из .env и стучится
# ровно тем путём, которым идёт телефон.
#
# И резервные копии конфигов нельзя класть в sites-enabled: nginx читает
# каталог целиком и подхватывает их как ещё один сайт.
location /api/call/ws {
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Разговор живёт минутами; умолчание в шестьдесят секунд рвало бы его.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
