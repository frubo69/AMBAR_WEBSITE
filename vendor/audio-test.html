<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Последняя проверка</title>
<!--
  Последняя проверка, и она про одну-единственную связку — ту, которую
  приложение может себе позволить.

  Что уже выяснено замерами на этом телефоне:

  · гудки через поток в элемент рвутся — путь закрыт, гудки обязаны идти
    прямым выходом веб-аудио, как и идут сегодня;
  · выбор устройства вывода на СВЕЖЕЙ странице голос в ухо уводил.

  Непроверенным остался ровно один случай: гудки прямым выходом (то есть как в
  приложении), а голос из соединения — в элементе, которому устройство
  называется, пока он ИГРАЕТ. Раньше я называл его молчащему, и это была
  догадка, выведенная из перезагрузки страницы, а не из сравнения.

  Если голос уйдёт в ухо — связка найдена и переносится в приложение как есть.
  Если нет — трубка у уха в мини-аппе невозможна, и разговор об этом закрыт.
-->
<style>
  :root{ --bg:#08080f; --card:#14141f; --line:rgba(255,255,255,.10);
         --text:#EDEDF2; --sub:rgba(237,237,242,.55); --gold:#C9A96E; --gold2:#E8C98A; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,
       BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:13px 14px;margin-bottom:12px}
  .card h2{font-size:13px;font-weight:700;color:var(--gold2);margin:0 0 8px;
           letter-spacing:.3px;text-transform:uppercase}
  button{width:100%;padding:15px 14px;margin-bottom:9px;border:0;border-radius:12px;
         background:#23233a;color:var(--text);font-size:15.5px;font-weight:600;
         cursor:pointer;text-align:left;font-family:inherit}
  button:active{transform:scale(.985)}
  button.main{background:var(--gold);color:#151009}
  button.stop{background:#E05555;color:#fff}
  button small{display:block;font-weight:400;color:rgba(255,255,255,.5);
               font-size:12.5px;margin-top:3px}
  button.main small{color:rgba(21,16,9,.6)}
  button:disabled{opacity:.35}
  pre{margin:0;white-space:pre-wrap;word-break:break-word;font-size:12.5px;
      color:var(--sub);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .ok{color:#5BC98A} .bad{color:#E88}
</style>

<h1>Последняя проверка</h1>
<div class="sub">Гудки — как в приложении, прямым выходом: они должны быть
  <b>ровные</b>. Голос — из соединения, и ему называется ушной динамик, пока он
  играет. Открывать заново адресом, не обновлением.</div>

<div class="card">
  <h2>1 · вызов</h2>
  <button class="main" id="go">Позвонить
    <small>микрофон и гудки прямым выходом — ровные, из громкого динамика</small></button>
</div>

<div class="card">
  <h2>2 · ответили</h2>
  <button id="ans" disabled>Сняли трубку
    <small>голос через соединение; ушной динамик назовём через секунду после начала</small></button>
</div>

<div class="card">
  <h2>3 · переключение</h2>
  <button id="ear" disabled>Трубка у уха</button>
  <button id="spk" disabled>Громкая связь</button>
  <button class="stop" id="end" disabled>Отбой</button>
</div>

<div class="card">
  <h2>Что видно</h2>
  <pre id="out">—</pre>
</div>

<script>
(function () {
  var out = document.getElementById('out'), строки = [];
  function лог(t, кл) {
    строки.unshift((кл ? (кл === 'ok' ? '✓ ' : '✗ ') : '· ') + t);
    out.innerHTML = строки.slice(0, 12).map(function (s) {
      var c = s[0] === '✓' ? 'ok' : s[0] === '✗' ? 'bad' : '';
      return '<span class="' + c + '">' + s.replace(/[<>&]/g, '') + '</span>';
    }).join('\n');
  }
  function кнопка(id, вкл) { document.getElementById(id).disabled = !вкл; }

  var ac = null, мик = null, ухо = '', гудки = null;
  var эл = null, A = null, B = null, голос = null;

  // Гудки — прямым выходом, ровно как в приложении сегодня. Через поток в
  // элемент они на этом телефоне рвутся, это уже проверено.
  function тон() {
    if (!ac || ac.state !== 'running') return;
    var o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime, v = 0.10;
    o.type = 'sine'; o.frequency.value = 425;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(v, t0 + 0.018);
    g.gain.setValueAtTime(v, t0 + 0.965);
    g.gain.linearRampToValueAtTime(0, t0 + 1.0);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + 1.02);
  }

  function назвать(id) {
    if (!эл) { лог('голоса ещё нет', 'bad'); return; }
    if (typeof эл.setSinkId !== 'function') { лог('выбор выхода недоступен', 'bad'); return; }
    лог('называю выход · элемент ' + (эл.paused ? 'молчит' : 'ИГРАЕТ'));
    эл.setSinkId(id || '')
      .then(function () { лог((id ? 'ушной динамик' : 'громкий динамик') + ' принят', 'ok'); })
      .catch(function (e) { лог('выход не принят — ' + e.name, 'bad'); });
  }

  document.getElementById('go').onclick = function () {
    navigator.mediaDevices.getUserMedia({audio: true}).then(function (s) {
      мик = s;
      лог('микрофон есть', 'ok');
      return navigator.mediaDevices.enumerateDevices();
    }).then(function (list) {
      var вых = list.filter(function (d) { return d.kind === 'audiooutput'; });
      var r = вых.filter(function (d) { return /receiver|earpiece|handset/i.test(d.label || ''); })[0];
      ухо = r ? r.deviceId : '';
      лог('выходы: ' + вых.map(function (d) { return d.label || '?'; }).join(', '));
      лог(ухо ? 'трубка в списке есть' : 'трубки в списке НЕТ', ухо ? 'ok' : 'bad');
      ac = new (window.AudioContext || window.webkitAudioContext)();
      return ac.resume();
    }).then(function () {
      лог('гудки пошли — они должны быть ровные', 'ok');
      тон(); гудки = setInterval(тон, 5000);
      кнопка('go', false); кнопка('ans', true); кнопка('end', true);
    }).catch(function (e) { лог('не вышло: ' + ((e && e.name) || e), 'bad'); });
  };

  document.getElementById('ans').onclick = function () {
    clearInterval(гудки); гудки = null;
    лог('гудки смолкли');
    // Голос собеседника: ровный тон через настоящее соединение.
    голос = ac.createOscillator();
    var g = ac.createGain(), d = ac.createMediaStreamDestination();
    голос.frequency.value = 660; g.gain.value = 0.11;
    голос.connect(g); g.connect(d); голос.start();

    A = new RTCPeerConnection(); B = new RTCPeerConnection();
    A.onicecandidate = function (e) { if (e.candidate) B.addIceCandidate(e.candidate); };
    B.onicecandidate = function (e) { if (e.candidate) A.addIceCandidate(e.candidate); };
    B.ontrack = function (e) {
      var st = (e.streams && e.streams[0]) || new MediaStream([e.track]);
      эл = document.createElement('audio');
      эл.autoplay = true; эл.setAttribute('playsinline', '');
      эл.style.cssText = 'position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:.01';
      document.body.appendChild(эл);
      эл.srcObject = st;
      эл.play().then(function () {
        лог('голос пошёл — сначала слушайте, ровный ли он', 'ok');
        // Именно так: даём голосу зазвучать и только потом называем устройство.
        setTimeout(function () {
          лог('через секунду называю ушной динамик');
          назвать(ухо);
          кнопка('ear', true); кнопка('spk', true);
        }, 1000);
      }).catch(function (er) { лог('голос не пошёл: ' + er.name, 'bad'); });
    };
    d.stream.getAudioTracks().forEach(function (t) { A.addTrack(t, d.stream); });
    A.createOffer().then(function (o) { return A.setLocalDescription(o); })
     .then(function () { return B.setRemoteDescription(A.localDescription); })
     .then(function () { return B.createAnswer(); })
     .then(function (an) { return B.setLocalDescription(an); })
     .then(function () { return A.setRemoteDescription(B.localDescription); })
     .catch(function (e) { лог('соединение не собралось: ' + e.name, 'bad'); });
    кнопка('ans', false);
  };

  document.getElementById('ear').onclick = function () { назвать(ухо); };
  document.getElementById('spk').onclick = function () { назвать(''); };

  document.getElementById('end').onclick = function () {
    clearInterval(гудки); гудки = null;
    try { if (голос) голос.stop(); } catch (e) {}
    if (эл) { try { эл.pause(); эл.srcObject = null; эл.remove(); } catch (e) {} }
    эл = null;
    try { if (A) A.close(); if (B) B.close(); } catch (e) {}
    try { if (мик) мик.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { if (ac) ac.close(); } catch (e) {}
    ac = null;
    ['go', 'ans', 'ear', 'spk', 'end'].forEach(function (id) { кнопка(id, false); });
    лог('отбой, всё остановлено', 'ok');
  };
})();
</script>
