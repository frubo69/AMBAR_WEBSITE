<style>
body{margin:0;padding:23px 22px 20px;background:#0a0a12;color:#ede9e0;font:400 15px/20px system-ui}
*{box-sizing:border-box}h1,h2,p{margin:0}
.hd{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid #30303a}
.lg{display:block;width:132px;height:29px;border-top:1px solid #8c8a9e;border-bottom:1px solid #8c8a9e;fill:#ede9e0}
.lc{margin-top:4px;font:500 9px/13px system-ui;letter-spacing:1.9px;color:#8c8a9e}
.tm{padding-top:2px;font-size:12px;line-height:16px;color:#8c8a9e}
h1{margin-top:18px;font:550 30px/34px system-ui;letter-spacing:-1.1px}.l{font-size:24px;letter-spacing:-.8px}
.wl{margin-top:18px;color:#8c8a9e}
.wh{margin-top:8px;font:600 clamp(24px,12.5vw,42px)/1.04 system-ui;letter-spacing:-.045em}
.sky{display:block;width:100%;margin-top:22px}
.sm{margin-top:8px;font-size:13px;line-height:19px;color:#8c8a9e}
.pr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:24px}
.pr b{font:400 11px/15px system-ui;padding-top:7px;border-top:1px solid #33333f;color:#8c8a9e}
.pr .on{border-color:#c9a96e;color:#ede9e0}
.st{display:flex;align-items:center;justify-content:space-between;gap:9px;min-height:52px;margin-top:20px}
h2{font:550 20px/25px system-ui;letter-spacing:-.55px}
.st p{margin-top:3px;font-size:14px;color:#8c8a9e}
.pl{flex:none;padding:4px 7px 5px;border-radius:5px;background:#fff;color:#101014;text-align:center;font:700 20px/24px ui-monospace,monospace;letter-spacing:-.6px;white-space:nowrap}
.pl small{display:block;font:700 8px/10px system-ui;letter-spacing:1.2px;color:#a51f28}
.dt{margin-top:16px;height:84px}
.mo,.ck{display:block;fill:none;stroke:#ede9e0;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mo{width:100%;height:84px}.ck{flex:none;width:29px;height:29px}
.m{stroke:#8c8a9e}.g{stroke:#444450;stroke-width:1}
.ra{padding-top:12px;border-top:1px solid #30303a;font-size:12px;line-height:17px;color:#8c8a9e}
.sx{display:flex;justify-content:space-between;margin-top:7px}
.sx svg{width:27px;height:27px;fill:none;stroke:#8c8a9e;stroke-linejoin:round}
.sx .on{fill:#c9a96e;stroke:#c9a96e}
.th{margin-top:6px;color:#c9a96e}
.bt{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;margin-top:21px;padding:11px 8px;border:1px solid #52515f;border-radius:10px;background:#0a0a12;color:#ede9e0;font:600 15px/20px system-ui}
.gd{background:#c9a96e;border-color:#c9a96e;color:#0a0a12}
.w{justify-content:space-between;padding:11px 13px}
.tk{stroke-dasharray:28;animation:ck .7s ease-out both}
@keyframes ck{0%{stroke-dashoffset:28}}
</style>
