<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>AMBAR · Водитель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000006; --bg2:#07070F; --bg3:#0B0B16;
  --card:#0E0E1B; --card2:#14142A; --card3:#1A1A32;
  --border:#1C1C33; --border2:#191930; --border3:#242440;
  --text:#F2F2F7; --sub:#A8A8C0; --muted:#6E6E8C; --dim:#40405C;
  --gold:#C9A96E; --gold2:#E8C98A; --gold-soft:rgba(201,169,110,.1);
  --up:#4CAF7D; --up-soft:rgba(76,175,125,.12);
  --dn:#E05555; --dn-soft:rgba(224,85,85,.12);
  --warn:#F3B44A; --warn-soft:rgba(243,180,74,.12);
  --info:#5B8DEF;
  --e1:cubic-bezier(.4,0,.2,1);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,sans-serif;
  font-size:15px;line-height:1.4;min-height:100dvh;
  padding:calc(12px + var(--safe-top)) 14px calc(24px + var(--safe-bottom))}

/* шапка */
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hdr-av{width:44px;height:44px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;
  color:#1a1408;background:linear-gradient(135deg,var(--gold),var(--gold2))}
.hdr-b{flex:1;min-width:0}
.hdr-n{font-size:17px;font-weight:700;line-height:1.2}
.hdr-s{font-size:11.5px;color:var(--muted);margin-top:2px}
.hdr-sum{text-align:right;flex-shrink:0}
.hdr-sum-v{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;
  color:var(--gold2);line-height:1;font-variant-numeric:tabular-nums}
.hdr-sum-l{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* вкладки */
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:10px;border:1px solid var(--border2);border-radius:11px;background:var(--card);
  color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  transition:.15s var(--e1)}
.tab.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408;border-color:transparent}
.tab:active{transform:scale(.97)}

/* заказ */
.ord{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:15px;
  margin-bottom:10px}
.ord.done{opacity:.55}
.ord-top{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.ord-id{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;color:var(--gold2)}
.ord-time{font-size:11px;color:var(--muted)}
.ord-sum{margin-left:auto;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700;
  font-variant-numeric:tabular-nums}
.ord-addr{font-size:14px;font-weight:600;line-height:1.35;margin-bottom:3px}
.ord-dist{font-size:11.5px;color:var(--muted);margin-bottom:11px}
.ord-items{border-top:1px solid var(--border2);padding-top:10px;margin-bottom:11px}
.ord-item{display:flex;gap:8px;font-size:13px;padding:3px 0;color:var(--sub)}
.ord-item b{margin-left:auto;font-family:'DM Sans',sans-serif;font-weight:700;color:var(--text);
  font-variant-numeric:tabular-nums}
.ord-note{font-size:12px;color:var(--warn);background:var(--warn-soft);
  border:1px solid rgba(243,180,74,.25);border-radius:9px;padding:8px 10px;margin-bottom:11px}
.ord-acts{display:flex;gap:7px}
.btn{flex:1;padding:12px 10px;border:none;border-radius:11px;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;transition:.15s var(--e1)}
.btn:active{transform:scale(.97)}
.btn-pri{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408}
.btn-sec{background:var(--card2);color:var(--sub);border:1px solid var(--border3);flex:0 0 auto;
  padding:12px 14px}
.btn:disabled{opacity:.45;pointer-events:none}

/* расходы */
.exp-card{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:15px;
  margin-bottom:10px}
.exp-h{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.exp-h-t{font-size:14px;font-weight:600}
.exp-h-v{margin-left:auto;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700}
.exp-line{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.exp-line-a{width:72px;flex-shrink:0;padding:9px;border-radius:9px;text-align:center;
  border:1px solid var(--border3);background:var(--card2);font-weight:700;
  font-variant-numeric:tabular-nums;font-size:13px}
.exp-line-c{flex:1;min-width:0;padding:9px 11px;border-radius:9px;border:1px solid var(--border3);
  background:var(--card2);font-size:12.5px;color:var(--sub);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.exp-st{flex-shrink:0;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase}
.exp-st.pending{background:var(--warn-soft);color:var(--warn);border:1px solid rgba(243,180,74,.3)}
.exp-st.approved{background:var(--up-soft);color:var(--up);border:1px solid rgba(76,175,125,.3)}
.exp-st.rejected{background:var(--dn-soft);color:var(--dn);border:1px solid rgba(224,85,85,.3)}
.exp-form{display:flex;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid var(--border2)}
.exp-form input{min-width:0;padding:11px;border-radius:10px;border:1px solid var(--border2);
  background:var(--bg3);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.exp-form input:focus{border-color:rgba(201,169,110,.5)}
.exp-form .amt{width:82px;text-align:center;font-weight:700}
.exp-form .cmt{flex:1}

/* прочее */
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6}
.sect{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);margin:18px 2px 9px}
.deny{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:40px;text-align:center;background:var(--bg)}
.deny.show{display:flex}
.deny-t{font-size:17px;font-weight:700}
.deny-s{font-size:13px;color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-bottom));transform:translate(-50%,14px);
  z-index:200;max-width:88vw;padding:12px 17px;border-radius:12px;pointer-events:none;
  background:var(--card2);border:1px solid var(--border3);box-shadow:0 10px 30px rgba(0,0,0,.5);
  font-size:13px;font-weight:600;opacity:0;transition:.18s var(--e1)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;
  background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}
.sheet.show{display:flex}
.sheet-in{width:100%;background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 16px;
  padding-bottom:calc(20px + var(--safe-bottom));border-top:1px solid var(--border2)}
.sheet-t{font-size:16px;font-weight:700;margin-bottom:4px}
.sheet-s{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.sheet textarea{width:100%;min-height:96px;padding:12px;border-radius:11px;resize:none;
  border:1px solid var(--border2);background:var(--bg3);color:var(--text);
  font-family:inherit;font-size:13.5px;outline:none}
.sheet textarea:focus{border-color:rgba(201,169,110,.5)}
.sheet-acts{display:flex;gap:8px;margin-top:12px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-av" id="dAv">—</div>
  <div class="hdr-b">
    <div class="hdr-n" id="dName">Загрузка…</div>
    <div class="hdr-s" id="dSub">—</div>
  </div>
  <div class="hdr-sum">
    <div class="hdr-sum-v" id="dSum">—</div>
    <div class="hdr-sum-l">сдал за смену</div>
  </div>
</div>

<div class="tabs">
  <button class="tab on" data-tab="orders" onclick="setTab('orders')">Заказы</button>
  <button class="tab" data-tab="expenses" onclick="setTab('expenses')">Расходы</button>
</div>

<div id="body"><div class="empty">Загрузка…</div></div>

<!-- запрос правки -->
<div class="sheet" id="editSheet">
  <div class="sheet-in">
    <div class="sheet-t">Что не так с заказом?</div>
    <div class="sheet-s" id="editFor">—</div>
    <textarea id="editText" placeholder="Например: клиент просит заменить Corona на Heineken, или адрес другой"></textarea>
    <div class="sheet-acts">
      <button class="btn btn-sec" onclick="closeEdit()">Отмена</button>
      <button class="btn btn-pri" onclick="sendEdit()">Отправить оператору</button>
    </div>
  </div>
</div>

<div class="deny" id="deny">
  <div class="deny-t">Нет доступа</div>
  <div class="deny-s">Этот аккаунт не в списке водителей.<br>Обратитесь к менеджеру.</div>
</div>

<script src="api.js"></script>
<script>
const tg = window.Telegram?.WebApp;
try{ tg.ready(); tg.expand(); tg.setHeaderColor?.('#000006'); tg.setBackgroundColor?.('#000006'); }catch(e){}

let ME = null, ORDERS = null, EXP = null, TAB = 'orders', EDIT_OID = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU').replace(/,/g, ' ');
const hhmm = iso => { if(!iso) return ''; const d = new Date(/Z$|[+-]\d{2}:?\d{2}$/.test(iso) ? iso : iso + 'Z');
  return isNaN(d) ? '' : d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', timeZone:'Asia/Dubai'}); };

function toast(msg){
  let el = document.getElementById('_t');
  if(!el){ el = document.createElement('div'); el.id = '_t'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toast._x); toast._x = setTimeout(()=>el.classList.remove('on'), 1900);
}

async function boot(){
  try{
    const p = await drvApi.drvFetch('/api/driver/ping');
    ME = p.driver;
  }catch(e){
    document.getElementById('deny').classList.add('show');
    return;
  }
  document.getElementById('dAv').textContent = ME.name.slice(0,2).toUpperCase();
  document.getElementById('dName').textContent = ME.name;
  document.getElementById('dSub').textContent =
    `${ME.district_code} ${ME.district_name}${ME.operator ? ' · ' + ME.operator : ''}`;
  await load();
  setInterval(load, 45000);      // новые заказы приходят без перезахода
}

async function load(){
  try{
    const [o, e] = await Promise.all([
      drvApi.drvFetch('/api/driver/orders'),
      drvApi.drvFetch('/api/driver/expenses'),
    ]);
    ORDERS = o; EXP = e;
  }catch(err){ return; }
  document.getElementById('dSum').textContent = fmt(ORDERS.total_aed);
  render();
}

function setTab(t){
  TAB = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  render();
  try{ tg.HapticFeedback.selectionChanged(); }catch(e){}
}

function render(){ TAB === 'orders' ? renderOrders() : renderExpenses(); }

function orderCard(o, done){
  const items = o.items.map(i =>
    `<div class="ord-item"><span>${esc(i.name)}</span><b>${i.qty}${i.pcs ? '×' + i.pcs : ''}</b></div>`).join('');
  const req = o.edit_request;
  return `<div class="ord ${done ? 'done' : ''}">
    <div class="ord-top">
      <span class="ord-id">#${esc(o.order_id)}</span>
      <span class="ord-time">${hhmm(o.confirmed_at || o.timestamp)}${
        o.deliver_by ? ' · до ' + esc(o.deliver_by) : ''}</span>
      <span class="ord-sum">${fmt(o.total)}</span>
    </div>
    <div class="ord-addr">${esc(o.address) || 'Адрес не указан'}</div>
    <div class="ord-dist">${esc(o.district || '')}${
      o.payment_method === 'debt' ? ' · В ДОЛГ — наличные не брать' : ''}</div>
    <div class="ord-items">${items}</div>
    ${o.comment ? `<div class="ord-note">${esc(o.comment)}</div>` : ''}
    ${req ? `<div class="ord-note">Правка отправлена: ${esc(req.text)}</div>` : ''}
    ${done ? '' : `<div class="ord-acts">
      <button class="btn btn-pri" onclick="markDelivered('${esc(o.order_id)}', this)">Доставил</button>
      ${o.phone ? `<button class="btn btn-sec" onclick="call('${esc(o.phone)}')">Позвонить</button>` : ''}
      ${(o.gmap_link || o.location?.lat) ? `<button class="btn btn-sec"
        onclick="route(${JSON.stringify(o.gmap_link || '')}, ${o.location?.lat || 0}, ${o.location?.lon || 0})">Карта</button>` : ''}
      <button class="btn btn-sec" onclick="openEdit('${esc(o.order_id)}')">Правка</button>
    </div>`}
  </div>`;
}

function renderOrders(){
  const box = document.getElementById('body');
  if(!ORDERS){ box.innerHTML = '<div class="empty">Загрузка…</div>'; return; }
  const {active, done} = ORDERS;
  if(!active.length && !done.length){
    box.innerHTML = '<div class="empty">Сегодня на вас пока ничего не назначено.<br>Заказ появится здесь сам.</div>';
    return;
  }
  box.innerHTML =
    (active.length ? `<div class="sect">В работе · ${active.length}</div>` +
      active.map(o => orderCard(o, false)).join('') : '')
    + (done.length ? `<div class="sect">Доставлено · ${done.length}</div>` +
      done.map(o => orderCard(o, true)).join('') : '');
}

function renderExpenses(){
  const box = document.getElementById('body');
  if(!EXP){ box.innerHTML = '<div class="empty">Загрузка…</div>'; return; }
  const st = x => x.status || 'approved';
  const LBL = {pending:'ждёт', approved:'принят', rejected:'отклонён'};
  const meal = EXP.working === null || EXP.working === undefined
    ? 'смена не отмечена' : `питание ${EXP.meal}`;
  box.innerHTML = `
    <div class="exp-card">
      <div class="exp-h"><span class="exp-h-t">Сегодня</span>
        <span class="exp-h-v">${fmt(EXP.meal + EXP.approved)} AED</span></div>
      <div class="exp-line">
        <span class="exp-line-a">${EXP.meal || '—'}</span>
        <span class="exp-line-c">${meal}</span>
      </div>
      ${(EXP.extras || []).map(x => `<div class="exp-line">
        <span class="exp-line-a">${x.amount}</span>
        <span class="exp-line-c">${esc(x.comment)}</span>
        <span class="exp-st ${st(x)}">${LBL[st(x)] || st(x)}</span>
      </div>`).join('')}
      <div class="exp-form">
        <input class="amt" id="eAmt" type="text" inputmode="numeric" placeholder="AED">
        <input class="cmt" id="eCmt" type="text" placeholder="за что — бензин, мойка">
      </div>
      <div class="ord-acts" style="margin-top:9px">
        <button class="btn btn-pri" onclick="sendExpense(this)">Отправить на согласование</button>
      </div>
    </div>
    ${EXP.pending ? `<div class="empty" style="padding:12px">Ждёт согласования: <b>${fmt(EXP.pending)} AED</b></div>` : ''}`;
}

async function markDelivered(oid, btn){
  if(!confirm('Отметить заказ #' + oid + ' как доставленный?')) return;
  btn.disabled = true; btn.textContent = 'Отмечаю…';
  try{
    await drvApi.drvFetch(`/api/driver/orders/${encodeURIComponent(oid)}/delivered`, {method:'POST'});
    try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
    toast('Заказ закрыт');
    await load();
  }catch(e){
    btn.disabled = false; btn.textContent = 'Доставил';
    toast(e.status === 409 ? 'Заказ уже закрыт' : 'Не получилось — попробуйте ещё раз');
  }
}

function call(phone){ try{ location.href = 'tel:+' + String(phone).replace(/\D/g,''); }catch(e){} }

function route(link, lat, lon){
  const url = link || (lat && lon ? `https://maps.google.com/?q=${lat},${lon}` : '');
  if(!url) return;
  try{ tg.openLink(url); }catch(e){ window.open(url, '_blank'); }
}

function openEdit(oid){
  EDIT_OID = oid;
  document.getElementById('editFor').textContent = 'Заказ #' + oid;
  document.getElementById('editText').value = '';
  document.getElementById('editSheet').classList.add('show');
  setTimeout(()=>document.getElementById('editText').focus(), 80);
}
function closeEdit(){ document.getElementById('editSheet').classList.remove('show'); EDIT_OID = null; }

async function sendEdit(){
  const text = document.getElementById('editText').value.trim();
  if(!text){ toast('Напишите, что не так'); return; }
  try{
    await drvApi.drvFetch(`/api/driver/orders/${encodeURIComponent(EDIT_OID)}/edit`,
      {method:'POST', body:{text}});
    closeEdit(); toast('Отправлено оператору');
    await load();
  }catch(e){ toast('Не отправилось'); }
}

async function sendExpense(btn){
  const amount = parseInt((document.getElementById('eAmt').value || '').replace(/\D/g,''), 10);
  const comment = (document.getElementById('eCmt').value || '').trim();
  if(!amount || !comment){ toast(!amount ? 'Впишите сумму' : 'Впишите, за что'); return; }
  btn.disabled = true;
  try{
    await drvApi.drvFetch('/api/driver/expenses', {method:'POST', body:{amount, comment}});
    toast('Отправлено на согласование');
    await load();
  }catch(e){ toast('Не отправилось'); }
  btn.disabled = false;
}

document.getElementById('editSheet').addEventListener('click', e => {
  if(e.target.id === 'editSheet') closeEdit();
});

boot();
</script>
</body>
</html>
