# nginx vhost for the owner miniapp subdomain.
#
# Serves:
#   https://owner.ambar-delivery.com/              →  aiohttp  /owner/       (static miniapp)
#   https://owner.ambar-delivery.com/api/owner/*   →  aiohttp  /api/owner/*  (owner API)
#
# Everything else on this subdomain is a 404 by design — customer API,
# operator routes, admin endpoints stay off this host. Defense in depth:
# even if an attacker knows the owner subdomain, they can't reach
# /api/customer/ or similar through it.
#
# SSL: Cloudflare Origin Certificate (15-year RSA, covers *.ambar-delivery.com).
# Traffic path: browser —TLS→ Cloudflare —TLS→ this nginx —HTTP(loopback)→ aiohttp:8080
#
# Install on VPS:
#   sudo ln -s /opt/ambar/MINIAPP/deploy/nginx-ambar-owner.conf \
#              /etc/nginx/sites-enabled/ambar-owner
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name owner.ambar-delivery.com;

    ssl_certificate     /etc/ssl/ambar-owner/fullchain.pem;
    ssl_certificate_key /etc/ssl/ambar-owner/privkey.pem;

    # Cloudflare fronts this host, so real client IP lives in CF-Connecting-IP.
    # Forward it plus standard proxy headers so aiohttp sees the right origin.
    real_ip_header   CF-Connecting-IP;
    client_max_body_size 10m;

    # Static miniapp. Path rewrite: external "/" → internal "/owner/".
    location = / {
        proxy_pass         http://127.0.0.1:8080/owner/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
    location / {
        proxy_pass         http://127.0.0.1:8080/owner/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # Owner API. Path preserved (no trailing slash on proxy_pass target).
    location /api/owner/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

# Plain-HTTP → HTTPS redirect (in case Cloudflare ever sends cleartext,
# or someone hits the origin IP directly with http://owner.ambar-delivery.com).
server {
    listen 80;
    listen [::]:80;
    server_name owner.ambar-delivery.com;
    return 301 https://$host$request_uri;
}
