<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>AMBAR · Водитель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000006; --bg2:#07070F; --bg3:#0B0B16;
  --card:#0E0E1B; --card2:#14142A; --card3:#1A1A32;
  --border:#1C1C33; --border2:#191930; --border3:#242440;
  --text:#F2F2F7; --sub:#A8A8C0; --muted:#6E6E8C; --dim:#40405C;
  --gold:#C9A96E; --gold2:#E8C98A; --gold-soft:rgba(201,169,110,.1);
  --up:#4CAF7D; --up-soft:rgba(76,175,125,.12);
  --dn:#E05555; --dn-soft:rgba(224,85,85,.12);
  --warn:#F3B44A; --warn-soft:rgba(243,180,74,.12);
  --info:#5B8DEF;
  --e1:cubic-bezier(.4,0,.2,1);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --tabbar:calc(62px + var(--safe-bottom));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,sans-serif;
  font-size:15px;line-height:1.4;min-height:100dvh;
  padding:calc(10px + var(--safe-top)) 13px calc(18px + var(--tabbar))}

/* шапка */
.hdr{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.hdr-av{width:42px;height:42px;flex-shrink:0;border-radius:13px;display:flex;align-items:center;
  justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;
  color:#1a1408;background:linear-gradient(135deg,var(--gold),var(--gold2))}
.hdr-b{flex:1;min-width:0}
.hdr-n{font-size:16px;font-weight:700;line-height:1.2}
.hdr-s{font-size:11.5px;color:var(--muted);margin-top:2px}
.hdr-sum{text-align:right;flex-shrink:0}
.hdr-sum-v{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;
  color:var(--gold2);line-height:1;font-variant-numeric:tabular-nums}
.hdr-sum-l{font-size:8.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* активный заказ — крупная карточка */
.ord{background:var(--card);border:1px solid var(--border2);border-radius:17px;
  margin-bottom:11px;overflow:hidden}
.ord.next{border-color:rgba(201,169,110,.42);box-shadow:0 0 0 1px rgba(201,169,110,.12)}
.ord-hd{display:flex;align-items:center;gap:9px;padding:12px 14px;
  border-bottom:1px solid var(--border2);background:var(--bg3)}
.ord-seq{width:26px;height:26px;flex-shrink:0;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;
  background:var(--card2);color:var(--muted)}
.ord.next .ord-seq{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408}
.ord-id{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:700;color:var(--sub)}
.ord-time{font-size:11px;color:var(--muted)}
.ord-sum{margin-left:auto;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700;
  font-variant-numeric:tabular-nums}
.ord-bd{padding:13px 14px}
.ord-addr{display:flex;gap:9px;align-items:flex-start;margin-bottom:11px;cursor:pointer}
.ord-addr-i{width:30px;height:30px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;
  justify-content:center;color:var(--gold2);background:var(--gold-soft);
  border:1px solid rgba(201,169,110,.22)}
.ord-addr-t{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.35}
.ord-addr-s{font-size:11px;color:var(--muted);margin-top:2px}
.ord-items{display:flex;flex-direction:column;gap:4px;padding:10px 0;
  border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);margin-bottom:11px}
.ord-item{display:flex;gap:8px;font-size:13.5px;color:var(--sub)}
.ord-item b{margin-left:auto;font-family:'DM Sans',sans-serif;font-weight:700;color:var(--text);
  font-variant-numeric:tabular-nums;flex-shrink:0}
.ord-flag{font-size:12px;padding:8px 11px;border-radius:10px;margin-bottom:11px;line-height:1.45}
.ord-flag.warn{color:var(--warn);background:var(--warn-soft);border:1px solid rgba(243,180,74,.25)}
.ord-flag.info{color:var(--info);background:rgba(91,141,239,.1);border:1px solid rgba(91,141,239,.25)}
.ord-acts{display:grid;grid-template-columns:1fr auto auto auto;gap:7px}
.btn{padding:13px 10px;border:none;border-radius:12px;cursor:pointer;font-family:inherit;
  font-size:13.5px;font-weight:700;transition:.15s var(--e1)}
.btn:active{transform:scale(.97)}
.btn-pri{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408}
.btn-ico{width:46px;padding:0;height:46px;background:var(--card2);color:var(--sub);
  border:1px solid var(--border3);display:flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.45;pointer-events:none}

/* закрытый заказ — компактная строка */
.done-row{display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:6px;
  border-radius:12px;background:var(--card);border:1px solid var(--border2);opacity:.62}
.done-row-t{flex:1;min-width:0}
.done-row-a{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done-row-s{font-size:11px;color:var(--muted);margin-top:1px}
.done-row-v{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;
  font-variant-numeric:tabular-nums;flex-shrink:0}

/* расходы */
.card{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:15px;
  margin-bottom:10px}
.card-h{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.card-h-t{font-size:14px;font-weight:600}
.card-h-v{margin-left:auto;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700}
.exp-line{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.exp-line-a{width:70px;flex-shrink:0;padding:10px 8px;border-radius:10px;text-align:center;
  border:1px solid var(--border3);background:var(--card2);font-weight:700;
  font-variant-numeric:tabular-nums;font-size:13px}
.exp-line-c{flex:1;min-width:0;padding:10px 11px;border-radius:10px;border:1px solid var(--border3);
  background:var(--card2);font-size:12.5px;color:var(--sub);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.exp-st{flex-shrink:0;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase}
.exp-st.pending{background:var(--warn-soft);color:var(--warn);border:1px solid rgba(243,180,74,.3)}
.exp-st.approved{background:var(--up-soft);color:var(--up);border:1px solid rgba(76,175,125,.3)}
.exp-st.rejected{background:var(--dn-soft);color:var(--dn);border:1px solid rgba(224,85,85,.3)}
.form{display:flex;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid var(--border2)}
.form input{min-width:0;padding:12px;border-radius:11px;border:1px solid var(--border2);
  background:var(--bg3);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.form input:focus{border-color:rgba(201,169,110,.5)}
.form .amt{width:84px;text-align:center;font-weight:700}
.form .cmt{flex:1}

/* история */
.hist-day{display:flex;align-items:baseline;gap:9px;margin:16px 2px 8px}
.hist-day-d{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--muted)}
.hist-day-v{margin-left:auto;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:700;
  color:var(--gold2);font-variant-numeric:tabular-nums}

/* прочее */
.empty{padding:46px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6}
.sect{display:flex;align-items:baseline;gap:8px;margin:16px 2px 9px}
.sect-t{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.sect-v{margin-left:auto;font-size:11px;color:var(--muted)}

/* нижняя панель */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  padding:8px 6px calc(8px + var(--safe-bottom));
  background:rgba(7,7,15,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border2)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;
  border:none;background:none;color:var(--muted);font-family:inherit;font-size:10px;
  font-weight:600;cursor:pointer;transition:.15s var(--e1)}
.tb.on{color:var(--gold2)}
.tb svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.tb-badge{position:absolute;transform:translate(14px,-4px);min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--gold2);color:#1a1408;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center}

.deny{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:40px;text-align:center;background:var(--bg)}
.deny.show{display:flex}
.deny-t{font-size:17px;font-weight:700}
.deny-s{font-size:13px;color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(16px + var(--tabbar));transform:translate(-50%,14px);
  z-index:200;max-width:88vw;padding:12px 17px;border-radius:12px;pointer-events:none;
  background:var(--card2);border:1px solid var(--border3);box-shadow:0 10px 30px rgba(0,0,0,.5);
  font-size:13px;font-weight:600;opacity:0;transition:.18s var(--e1)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* шторка правки */
.sheet{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;
  background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
.sheet.show{display:flex}
.sheet-in{width:100%;max-height:88dvh;overflow-y:auto;background:var(--bg2);
  border-radius:20px 20px 0 0;padding:18px 14px calc(18px + var(--safe-bottom));
  border-top:1px solid var(--border2)}
.sheet-t{font-size:16px;font-weight:700;margin-bottom:3px}
.sheet-s{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{padding:9px 13px;border-radius:11px;cursor:pointer;border:1px solid var(--border3);
  background:var(--card2);color:var(--sub);font-family:inherit;font-size:12.5px;font-weight:600;
  transition:.14s var(--e1)}
.chip.on{background:var(--gold-soft);border-color:rgba(201,169,110,.45);color:var(--gold2)}
.chip:active{transform:scale(.95)}
.sheet textarea{width:100%;min-height:90px;padding:12px;border-radius:12px;resize:none;
  border:1px solid var(--border2);background:var(--bg3);color:var(--text);
  font-family:inherit;font-size:13.5px;outline:none}
.sheet textarea:focus{border-color:rgba(201,169,110,.5)}
.sheet-acts{display:flex;gap:8px;margin-top:12px}
.sheet-acts .btn{flex:1}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-av" id="dAv">—</div>
  <div class="hdr-b">
    <div class="hdr-n" id="dName">Загрузка…</div>
    <div class="hdr-s" id="dSub">—</div>
  </div>
  <div class="hdr-sum">
    <div class="hdr-sum-v" id="dSum">—</div>
    <div class="hdr-sum-l" id="dSumL">сдал за смену</div>
  </div>
</div>

<div id="body"><div class="empty">Загрузка…</div></div>

<nav class="tabbar" id="tabbar">
  <button class="tb on" data-tab="orders" onclick="setTab('orders')">
    <svg viewBox="0 0 24 24"><path d="M5 3h14l1 5H4z"/><path d="M6 8v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
    <span>Заказы<span class="tb-badge" id="tbNum" style="display:none">0</span></span>
  </button>
  <button class="tb" data-tab="history" onclick="setTab('history')">
    <svg viewBox="0 0 24 24"><path d="M3 3v5h5"/><path d="M3.5 8a9 9 0 1 0 2.2-3.4L3 8"/><path d="M12 7v5l3 2"/></svg>
    <span>История</span>
  </button>
  <button class="tb" data-tab="expenses" onclick="setTab('expenses')">
    <svg viewBox="0 0 24 24"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    <span>Расходы<span class="tb-badge" id="tbExp" style="display:none">0</span></span>
  </button>
</nav>

<div class="sheet" id="editSheet">
  <div class="sheet-in">
    <div class="sheet-t">Что не так с заказом?</div>
    <div class="sheet-s" id="editFor">—</div>
    <div class="chips" id="editChips"></div>
    <textarea id="editText" placeholder="Опишите подробнее — что именно и на что менять"></textarea>
    <div class="sheet-acts">
      <button class="btn btn-ico" style="width:auto;padding:13px 16px" onclick="closeEdit()">Отмена</button>
      <button class="btn btn-pri" onclick="sendEdit()">Отправить оператору</button>
    </div>
  </div>
</div>

<div class="deny" id="deny">
  <div class="deny-t">Нет доступа</div>
  <div class="deny-s">Этот аккаунт не в списке водителей.<br>Обратитесь к менеджеру.</div>
</div>

<script src="api.js"></script>
<script>
const tg = window.Telegram?.WebApp;
try{ tg.ready(); tg.expand(); tg.setHeaderColor?.('#000006'); tg.setBackgroundColor?.('#000006'); }catch(e){}

let ME = null, ORDERS = null, EXP = null, HIST = null;
let TAB = 'orders', EDIT_OID = null, EDIT_TAGS = [];

const ICO = {
  pin:  '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  call: '<path d="M5 3h5l2 5-3 2a12 12 0 0 0 5 5l2-3 5 2v5a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
  edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/>',
};
const svg = (d, w=19) => `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none"
  stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU').replace(/,/g, ' ');
const _d = iso => { if(!iso) return null;
  const d = new Date(/Z$|[+-]\d{2}:?\d{2}$/.test(iso) ? iso : iso + 'Z'); return isNaN(d) ? null : d; };
const hhmm = iso => { const d = _d(iso); return d
  ? d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', timeZone:'Asia/Dubai'}) : ''; };
const ago = iso => { const d = _d(iso); if(!d) return '';
  const m = Math.round((Date.now() - d) / 60000);
  return m < 1 ? 'только что' : m < 60 ? `${m} мин назад` : `${Math.floor(m/60)} ч назад`; };
const dayLbl = iso => { const d = _d(iso + 'T12:00:00Z'); if(!d) return iso;
  return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'long', weekday:'short'}); };

function toast(msg){
  let el = document.getElementById('_t');
  if(!el){ el = document.createElement('div'); el.id = '_t'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toast._x); toast._x = setTimeout(()=>el.classList.remove('on'), 1900);
}

async function boot(){
  try{ ME = (await drvApi.drvFetch('/api/driver/ping')).driver; }
  catch(e){ document.getElementById('deny').classList.add('show'); return; }
  document.getElementById('dAv').textContent = ME.name.slice(0,2).toUpperCase();
  document.getElementById('dName').textContent = ME.name;
  document.getElementById('dSub').textContent =
    `${ME.district_code} ${ME.district_name}${ME.operator ? ' · ' + ME.operator : ''}`;
  await load();
  setInterval(load, 45000);          // новый заказ приходит сам, без перезахода
}

async function load(){
  try{
    const [o, e] = await Promise.all([
      drvApi.drvFetch('/api/driver/orders'),
      drvApi.drvFetch('/api/driver/expenses'),
    ]);
    ORDERS = o; EXP = e;
  }catch(err){ return; }
  const n = ORDERS.active.length;
  const b = document.getElementById('tbNum');
  b.style.display = n ? 'flex' : 'none'; b.textContent = n;
  const be = document.getElementById('tbExp');
  const pend = (EXP.extras || []).filter(x => (x.status || 'approved') === 'pending').length;
  be.style.display = pend ? 'flex' : 'none'; be.textContent = pend;
  render();
}

function setTab(t){
  TAB = t;
  document.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if(t === 'history' && !HIST) loadHistory(); else render();
  try{ tg.HapticFeedback.selectionChanged(); }catch(e){}
  window.scrollTo({top:0});
}

function render(){
  if(TAB === 'orders')   return renderOrders();
  if(TAB === 'history')  return renderHistory();
  return renderExpenses();
}

// ── заказы ────────────────────────────────────────────────────────────────
// Первый в списке выделен: у водителя один следующий адрес, а не пять
// равнозначных, и решать, куда ехать, приложение должно за него.
function orderCard(o, i){
  const items = o.items.map(it =>
    `<div class="ord-item"><span>${esc(it.name)}</span><b>${it.qty}${it.pcs ? '×' + it.pcs : ''}</b></div>`).join('');
  const addr = esc(o.address) || 'Адрес не указан';
  const hasMap = !!(o.gmap_link || (o.location && o.location.lat));
  return `<div class="ord ${i === 0 ? 'next' : ''}">
    <div class="ord-hd">
      <span class="ord-seq">${i + 1}</span>
      <span class="ord-id">#${esc(o.order_id)}</span>
      <span class="ord-time">${ago(o.confirmed_at || o.timestamp)}${
        o.deliver_by ? ' · до ' + esc(o.deliver_by) : ''}</span>
      <span class="ord-sum">${fmt(o.total)}</span>
    </div>
    <div class="ord-bd">
      <div class="ord-addr" onclick="route(${JSON.stringify(o.gmap_link || '')},${
        (o.location && o.location.lat) || 0},${(o.location && o.location.lon) || 0},'${esc(addr)}')">
        <span class="ord-addr-i">${svg(ICO.pin, 16)}</span>
        <span class="ord-addr-t">${addr}
          <span class="ord-addr-s">${esc(o.district || '')}${hasMap ? ' · нажмите, чтобы открыть карту' : ''}</span>
        </span>
      </div>
      <div class="ord-items">${items}</div>
      ${o.payment_method === 'debt'
        ? '<div class="ord-flag warn">В ДОЛГ — наличные не брать</div>' : ''}
      ${o.comment ? `<div class="ord-flag info">${esc(o.comment)}</div>` : ''}
      ${o.edit_request ? `<div class="ord-flag warn">Правка отправлена: ${esc(o.edit_request.text)}</div>` : ''}
      <div class="ord-acts">
        <button class="btn btn-pri" onclick="markDelivered('${esc(o.order_id)}', this)">Доставил</button>
        ${o.phone ? `<button class="btn btn-ico" title="Позвонить"
          onclick="call('${esc(o.phone)}')">${svg(ICO.call)}</button>` : ''}
        ${hasMap ? `<button class="btn btn-ico" title="Маршрут"
          onclick="route(${JSON.stringify(o.gmap_link || '')},${
          (o.location && o.location.lat) || 0},${(o.location && o.location.lon) || 0},'${esc(addr)}')"
          >${svg(ICO.pin)}</button>` : ''}
        <button class="btn btn-ico" title="Правка"
          onclick="openEdit('${esc(o.order_id)}')">${svg(ICO.edit)}</button>
      </div>
    </div>
  </div>`;
}

function doneRow(o){
  return `<div class="done-row">
    <span class="done-row-t">
      <span class="done-row-a">${esc(o.address) || '—'}</span>
      <span class="done-row-s">#${esc(o.order_id)} · ${hhmm(o.confirmed_at || o.timestamp)}</span>
    </span>
    <span class="done-row-v">${fmt(o.total)}</span>
  </div>`;
}

function renderOrders(){
  const box = document.getElementById('body');
  if(!ORDERS){ box.innerHTML = '<div class="empty">Загрузка…</div>'; return; }
  document.getElementById('dSum').textContent = fmt(ORDERS.total_aed);
  document.getElementById('dSumL').textContent = 'сдал за смену';
  const {active, done} = ORDERS;
  if(!active.length && !done.length){
    box.innerHTML = `<div class="empty">На вас пока ничего не назначено.<br>
      Новый заказ придёт сообщением и появится здесь.</div>`;
    return;
  }
  box.innerHTML =
    (active.length
      ? `<div class="sect"><span class="sect-t">В работе</span><span class="sect-v">${active.length}</span></div>`
        + active.map((o, i) => orderCard(o, i)).join('')
      : '<div class="empty" style="padding:30px 20px">Активных заказов нет</div>')
    + (done.length
      ? `<div class="sect"><span class="sect-t">Закрыто сегодня</span><span class="sect-v">${done.length}</span></div>`
        + done.map(doneRow).join('') : '');
}

// ── история ───────────────────────────────────────────────────────────────
async function loadHistory(){
  document.getElementById('body').innerHTML = '<div class="empty">Загрузка…</div>';
  try{ HIST = await drvApi.drvFetch('/api/driver/history', {params:{days:14}}); }
  catch(e){ document.getElementById('body').innerHTML = '<div class="empty">Не удалось загрузить</div>'; return; }
  render();
}

function renderHistory(){
  const box = document.getElementById('body');
  if(!HIST){ box.innerHTML = '<div class="empty">Загрузка…</div>'; return; }
  document.getElementById('dSum').textContent = fmt(HIST.total_aed);
  document.getElementById('dSumL').textContent = 'за 14 дней';
  if(!HIST.days.length){
    box.innerHTML = '<div class="empty">За две недели закрытых заказов нет.</div>';
    return;
  }
  box.innerHTML = HIST.days.map(g => `
    <div class="hist-day">
      <span class="hist-day-d">${dayLbl(g.day)}</span>
      <span class="sect-v">${g.count} ${g.count === 1 ? 'заказ' : g.count < 5 ? 'заказа' : 'заказов'}</span>
      <span class="hist-day-v">${fmt(g.aed)} AED</span>
    </div>
    ${g.orders.map(doneRow).join('')}`).join('');
}

// ── расходы ───────────────────────────────────────────────────────────────
function renderExpenses(){
  const box = document.getElementById('body');
  if(!EXP){ box.innerHTML = '<div class="empty">Загрузка…</div>'; return; }
  const st = x => x.status || 'approved';
  const LBL = {pending:'ждёт', approved:'принят', rejected:'отклонён'};
  const meal = (EXP.working === null || EXP.working === undefined)
    ? 'смена ещё не отмечена' : (EXP.working ? 'питание · на смене' : 'питание · выходной');
  document.getElementById('dSum').textContent = fmt(EXP.meal + EXP.approved);
  document.getElementById('dSumL').textContent = 'расходы за день';
  box.innerHTML = `
    <div class="card">
      <div class="card-h"><span class="card-h-t">Сегодня</span>
        <span class="card-h-v">${fmt(EXP.meal + EXP.approved)} AED</span></div>
      <div class="exp-line">
        <span class="exp-line-a">${EXP.meal || '—'}</span>
        <span class="exp-line-c">${meal}</span>
      </div>
      ${(EXP.extras || []).map(x => `<div class="exp-line">
        <span class="exp-line-a">${x.amount}</span>
        <span class="exp-line-c">${esc(x.comment)}</span>
        <span class="exp-st ${st(x)}">${LBL[st(x)] || st(x)}</span>
      </div>`).join('')}
      <div class="form">
        <input class="amt" id="eAmt" type="text" inputmode="numeric" placeholder="AED">
        <input class="cmt" id="eCmt" type="text" placeholder="за что — бензин, мойка">
      </div>
      <div style="margin-top:9px">
        <button class="btn btn-pri" style="width:100%" onclick="sendExpense(this)">Отправить на согласование</button>
      </div>
    </div>
    ${EXP.pending ? `<div class="empty" style="padding:14px">
      Ждёт решения менеджера: <b style="color:var(--warn)">${fmt(EXP.pending)} AED</b></div>` : ''}`;
}

// ── действия ──────────────────────────────────────────────────────────────
async function markDelivered(oid, btn){
  if(!confirm('Отметить заказ #' + oid + ' как доставленный?')) return;
  btn.disabled = true; btn.textContent = 'Отмечаю…';
  try{
    await drvApi.drvFetch(`/api/driver/orders/${encodeURIComponent(oid)}/delivered`, {method:'POST'});
    try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
    toast('Заказ закрыт');
    HIST = null;                       // история устарела
    await load();
  }catch(e){
    btn.disabled = false; btn.textContent = 'Доставил';
    toast(e.status === 409 ? 'Заказ уже закрыт' : 'Не получилось — попробуйте ещё раз');
  }
}

function call(phone){ try{ location.href = 'tel:+' + String(phone).replace(/\D/g,''); }catch(e){} }

function route(link, lat, lon, addr){
  const url = link || (lat && lon ? `https://maps.google.com/?q=${lat},${lon}`
                                  : (addr ? 'https://maps.google.com/?q=' + encodeURIComponent(addr) : ''));
  if(!url) return;
  try{ tg.openLink(url); }catch(e){ window.open(url, '_blank'); }
}

// Готовые причины: за рулём набирать текст неудобно, а оператору нужна не
// поэма, а понятная причина. Своими словами — по желанию, поверх тега.
const EDIT_REASONS = ['Нет в наличии', 'Клиент просит другое', 'Изменить количество',
                      'Адрес не тот', 'Клиент не отвечает', 'Клиент отказался'];

function openEdit(oid){
  EDIT_OID = oid; EDIT_TAGS = [];
  document.getElementById('editFor').textContent = 'Заказ #' + oid;
  document.getElementById('editText').value = '';
  document.getElementById('editChips').innerHTML = EDIT_REASONS.map(r =>
    `<button class="chip" onclick="toggleTag(this,'${esc(r)}')">${esc(r)}</button>`).join('');
  document.getElementById('editSheet').classList.add('show');
}
function toggleTag(el, r){
  const i = EDIT_TAGS.indexOf(r);
  if(i >= 0) EDIT_TAGS.splice(i, 1); else EDIT_TAGS.push(r);
  el.classList.toggle('on');
  try{ tg.HapticFeedback.selectionChanged(); }catch(e){}
}
function closeEdit(){ document.getElementById('editSheet').classList.remove('show'); EDIT_OID = null; }

async function sendEdit(){
  const free = document.getElementById('editText').value.trim();
  const text = [EDIT_TAGS.join(', '), free].filter(Boolean).join(' — ');
  if(!text){ toast('Выберите причину или напишите, что не так'); return; }
  try{
    await drvApi.drvFetch(`/api/driver/orders/${encodeURIComponent(EDIT_OID)}/edit`,
      {method:'POST', body:{text}});
    closeEdit(); toast('Отправлено оператору');
    await load();
  }catch(e){ toast('Не отправилось'); }
}

async function sendExpense(btn){
  const amount = parseInt((document.getElementById('eAmt').value || '').replace(/\D/g,''), 10);
  const comment = (document.getElementById('eCmt').value || '').trim();
  if(!amount || !comment){ toast(!amount ? 'Впишите сумму' : 'Впишите, за что'); return; }
  btn.disabled = true;
  try{
    await drvApi.drvFetch('/api/driver/expenses', {method:'POST', body:{amount, comment}});
    toast('Отправлено на согласование');
    await load();
  }catch(e){ toast('Не отправилось'); }
  btn.disabled = false;
}

document.getElementById('editSheet').addEventListener('click', e => {
  if(e.target.id === 'editSheet') closeEdit();
});

boot();
</script>
